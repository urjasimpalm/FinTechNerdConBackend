name: Deploy Supabase

# staging branch    → staging project
# main branch       → production project
# production branch → production project
# manual dispatch   → whichever you pick
#
# The selected target determines which credentials are used.
# Staging uses the existing SUPABASE_* secrets.
# Production uses the PRODUCTION_SUPABASE_* secrets.
# See postman/ENVIRONMENTS.md for the one-time setup.

on:
  push:
    branches:
      - main
      - staging
      - production

  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project to deploy to
        type: choice
        required: true
        options:
          - staging
          - production
        default: staging

# Prevent simultaneous deployments to the same project from racing
# on the database migration history.
# main and production share the production concurrency group.
concurrency:
  group: supabase-deploy-${{ github.event.inputs.target || ((github.ref_name == 'main' || github.ref_name == 'production') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Select the GitHub Environment for the deployment.
    # main and production use production; staging uses staging.
    # Manual dispatch uses the selected target.
    environment: ${{ github.event.inputs.target || ((github.ref_name == 'main' || github.ref_name == 'production') && 'production' || 'staging') }}

    env:
      # Use production credentials for main, production, or a manual
      # production deployment. Otherwise, use staging credentials.
      SUPABASE_ACCESS_TOKEN: ${{ ((github.event.inputs.target == 'production') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))) && secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}

      # Needed by `db push`; use the database password for the target project.
      SUPABASE_DB_PASSWORD: ${{ ((github.event.inputs.target == 'production') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))) && secrets.PRODUCTION_SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}

      # Reference ID of the target Supabase project.
      PROJECT_REF: ${{ ((github.event.inputs.target == 'production') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))) && secrets.PRODUCTION_SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned, not `latest`. Resolving `latest` calls the GitHub releases API
      # and can fail intermittently due to unauthenticated API rate limits.
      # A pinned version makes deployments reproducible.
      #
      # 2.115.0 is the version used by this project locally.
      # Bump it deliberately and test the change on staging first.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Validate the target and credentials before changing any remote project.
      - name: Check the target project is configured
        shell: bash
        env:
          TARGET_ENV: ${{ github.event.inputs.target || ((github.ref_name == 'main' || github.ref_name == 'production') && 'production' || 'staging') }}
        run: |
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ] && \
             [ "$GITHUB_REF" != "refs/heads/main" ] && \
             [ "$GITHUB_REF" != "refs/heads/production" ]; then
            echo "ERROR: Production deployments must run from main or production." >&2
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase access token is missing." >&2
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase database password is missing." >&2
            exit 1
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "Supabase project reference is missing." >&2
            exit 1
          fi

          echo "Target environment: $TARGET_ENV"
          echo "Deploying to project $PROJECT_REF"

      # Link the CLI to the selected Supabase project.
      - name: Link Supabase project
        run: |
          supabase link --project-ref "$PROJECT_REF"

      # Apply pending SQL migrations from supabase/migrations.
      - name: Deploy database migrations
        run: |
          supabase db push

      # Deploy only the explicitly listed Edge Functions.
      # Add new function names to this list when they are ready to deploy.
      # This avoids deploying unfinished functions accidentally.
      - name: Deploy edge functions
        run: |
          supabase functions deploy \
            login register verify-email forgot-password reset-password config \
            user chat admin \
            --project-ref "$PROJECT_REF"