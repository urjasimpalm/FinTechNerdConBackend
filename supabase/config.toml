# Matches the container names of the already-running local stack
# (supabase_db_FinTechNerdConBackend), which the CLI derived from the directory
# name while this file was missing.
project_id = "FinTechNerdConBackend"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

# auth/reset-password takes the 6-digit code from this email. The stock template
# only contains the {{ .ConfirmationURL }} deep link, which the code-based flow
# can't use, so the recovery mail is overridden to include {{ .Token }}.
# Remember the hosted project has its own copy: Authentication → Emails →
# Reset Password must include {{ .Token }} there too, or the deployed
# reset-password will only work with `token_hash` from the link.
[auth.email.template.recovery]
subject = "Reset your FinTechNerdCon password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true

[analytics]
enabled = false

# Per-project overrides for `supabase config push`. Uncomment and fill in the
# project refs before using it — pushing the settings above as-is would repoint a
# hosted project's auth redirects at localhost. See postman/ENVIRONMENTS.md.
#
# [remotes.staging]
# project_id = "your-staging-project-ref"
#
# [remotes.staging.auth]
# site_url = "https://staging.yourdomain.com"
# additional_redirect_urls = ["https://staging.yourdomain.com/**"]

# auth/login, auth/register, auth/verify-email and config are reached before the
# caller has a session, so they must not require a JWT. They still need the
# project's anon key in the apikey header, and they validate their own input.
[functions.login]
verify_jwt = false

[functions.register]
verify_jwt = false

[functions.verify-email]
verify_jwt = false

# Password reset: the caller has no session by definition — owning the emailed
# code is what authorises the change.
[functions.forgot-password]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

[functions.config]
verify_jwt = false

# user/profile (GET and PUT). Same reasoning as the admin routes: verify_jwt keeps
# out requests with no JWT at all, and the function resolves the caller from the
# token itself, so the anon key alone gets a 401.
[functions.user]
verify_jwt = true

# chat/create, chat/list, chat/details/{id}, chat/send/{id}. Same as the user
# routes: the function resolves the caller from the token and checks they are a
# participant, so the anon key alone gets a 401.
[functions.chat]
verify_jwt = true

# Admin routes (admin/user/list, admin/user/add, admin/user/remove). verify_jwt
# is left on so the gateway rejects requests with no JWT at all, but it is not the
# real gate: the anon key is itself a valid JWT, so the function checks
# public.users.is_admin for the caller.
[functions.admin]
verify_jwt = true
